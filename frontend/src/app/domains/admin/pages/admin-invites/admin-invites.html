<section class="page-shell page-layout">
  <header class="page-intro">
    <h1 class="page-title">Invite links</h1>
    <p class="page-copy">
      Generate a one-time registration link for a new user account.
    </p>
  </header>

  <section class="surface-panel surface-stack">
    <button
      type="button"
      class="primary-action"
      (click)="generateInvite()"
      [disabled]="isSubmitting()"
    >
      Generate invite link
    </button>

    @if (invite(); as generatedInvite) {
      <div class="inset-panel section-stack">
        <div class="form-field">
          <label class="field-label" for="invite-url">Invite URL</label>
          <input
            id="invite-url"
            class="field-input"
            readonly
            [value]="generatedInvite.invite_url"
          />
        </div>

        <p class="entry-meta">
          Expires {{ generatedInvite.expires_at | date: "medium" }}
        </p>

        <div class="flex flex-wrap items-center gap-3">
          <button type="button" class="quiet-action" (click)="copyInviteLink()">
            Copy link
          </button>

          @if (copyMessage()) {
            <span class="entry-meta">{{ copyMessage() }}</span>
          }
        </div>
      </div>
    }

    @if (error()) {
      <div class="status-message error">{{ error() }}</div>
    }
  </section>
</section>
