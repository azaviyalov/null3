<section class="page-shell-wide page-layout">
  <header class="page-intro">
    <h1 class="page-title">Mood records</h1>

    <div class="page-actions">
      <button type="button" class="primary-action" (click)="createEntry()">
        New mood record
      </button>
    </div>
  </header>

  <section class="surface-panel surface-stack">
    <app-mood-record-history
      [skeleton]="isLoading()"
      [skeletonCount]="defaultPageSize"
      [entries]="page()?.items ?? null"
      [showOpen]="true"
      emptyMessage="No mood records found."
      (open)="openEntry($event)"
    />

    @if (canGoPrevious() || canGoNext()) {
      <nav class="collection-pagination" aria-label="Mood record pages">
        @if (canGoPrevious()) {
          <button
            type="button"
            class="collection-page-link"
            (click)="goToPreviousPage()"
          >
            ← Newer mood records
          </button>
        }
        @if (canGoNext()) {
          <button
            type="button"
            class="collection-page-link collection-page-link-next"
            (click)="goToNextPage()"
          >
            Older mood records →
          </button>
        }
      </nav>
    }
  </section>
</section>
