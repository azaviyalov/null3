<section class="page-shell-wide page-layout">
  <header class="page-intro">
    <h1 class="page-title">Diary entries</h1>
    <p class="page-copy">
      Longer notes and reflections, with links to your mood records.
    </p>

    <div class="page-actions">
      <button type="button" class="primary-action" (click)="createEntry()">
        New diary entry
      </button>
    </div>
  </header>

  <section class="surface-panel surface-stack">
    <app-diary-entry-feed
      [skeleton]="isLoading()"
      [skeletonCount]="defaultPageSize"
      [entries]="page()?.items ?? null"
      [showOpen]="true"
      emptyMessage="No diary entries found."
      (open)="openEntry($event)"
    />

    @if (canGoPrevious() || canGoNext()) {
      <nav class="collection-pagination" aria-label="Diary entry pages">
        @if (canGoPrevious()) {
          <button
            type="button"
            class="collection-page-link"
            (click)="goToPreviousPage()"
          >
            ← Newer entries
          </button>
        }
        @if (canGoNext()) {
          <button
            type="button"
            class="collection-page-link collection-page-link-next"
            (click)="goToNextPage()"
          >
            Older entries →
          </button>
        }
      </nav>
    }
  </section>
</section>
