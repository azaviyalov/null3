root = "."
tmp_dir = "tmp"
env_files = ["../.env"]

[build]
cmd = "go build -o ./tmp/server ./cmd/server"
entrypoint = ["./tmp/server"]
include_ext = ["go", "mod", "sum"]
exclude_dir = ["bin", "internal/core/frontend/fs", "tmp"]
exclude_regex = ["_test\\.go"]
exclude_unchanged = true
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "1s"

[log]
time = false

[misc]
clean_on_exit = true
startup_banner = ""

[screen]
clear_on_rebuild = false
keep_scroll = true
